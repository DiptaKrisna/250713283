<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Lomba</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>

<body>

    <div id="Informasi">

        <h1>Formulir Pendaftaran Lomba</h1>

        <form action="" method="post" enctype="multipart/form-data">

            <h3>Data Peserta</h3>

            <table border="1" cellpadding="5" cellspacing="0">
                <tr>
                    <td>Nama Lengkap</td>
                    <td>
                        <input type="text" id="nama" name="nama" />
                    </td>
                </tr>

                <tr>
                    <td>Jenis Kelamin</td>
                    <td>
                        <input type="radio" id="laki" name="jenis_kelamin"
                        value="Laki-laki" />
                        <label for="laki">Laki-laki</label>

                        <input type="radio" id="perempuan" name="jenis_kelamin"
                        value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>

                <tr>
                    <td>Asal Universitas</td>
                    <td>
                        <input type="text" id="universitas" name="universitas" />
                    </td>
                </tr>

                <tr>
                    <td>NIM</td>
                    <td>
                        <input type="text" id="nim" name="nim" />
                    </td>
                </tr>
            </table>

            <h3>Pilihan Lomba</h3>

            <table border="1" cellpadding="5" cellspacing="0">
                <tr>
                    <td>Jenis Lomba</td>
                    <td>
                        <input type="radio" id="futsal" name="lomba"
                        value="Futsal" />
                        <label for="futsal">Futsal</label>
                        <br />

                        <input type="radio" id="basket" name="lomba"
                        value="Basket" />
                        <label for="basket">Basket</label>
                        <br />

                        <input type="radio" id="badminton" name="lomba"
                        value="Badminton" />
                        <label for="badminton">Badminton</label>
                    </td>
                </tr>

                <tr>
                    <td>Nama Tim</td>
                    <td>
                        <input type="text" id="tim" name="tim" />
                    </td>
                </tr>

                <tr>
                    <td>Alasan Mengikuti Lomba</td>
                    <td>
                        <textarea id="alasan" name="alasan"
                        rows="4" cols="25"></textarea>
                    </td>
                </tr>
            </table>

            <h3>Pembayaran</h3>

            <table border="1" cellpadding="5" cellspacing="0">
                <tr>
                    <td>Bukti Pembayaran</td>
                    <td>
                        <input type="file" id="bukti" name="bukti" />
                    </td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" name="daftar" value="Daftar" />
                    </td>
                </tr>
            </table>

        </form>

    </div>

</body>
</html>
